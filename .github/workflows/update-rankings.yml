name: Auto Update Ladder Rankings

on:
  schedule:
    - cron: '0 0 * * 0' # 每週日 UTC 00:00 (每 7 天自動執行一次)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "rankings-update"
  cancel-in-progress: true

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Rankings Update Pipeline
        run: npm run update:rankings

      - name: Check for data changes
        id: git_diff
        run: |
          git diff --stat
          if git diff --quiet src/data/formats/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No ranking changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Ranking data updated."
          fi

      - name: Commit and Push changes
        if: steps.git_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/formats/
          git commit -m "chore(data): auto-update ladder rankings for current season [skip ci]"
          git push origin main

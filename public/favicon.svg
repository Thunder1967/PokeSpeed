<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="60%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="ringRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>

  <!-- Pure Circular Poké Ball Sphere Base -->
  <circle cx="32" cy="32" r="28" fill="#0F172A" />

  <!-- Outer Poké Ball Arc (Top Red) -->
  <path d="M 6.5 32 A 25.5 25.5 0 0 1 57.5 32" fill="none" stroke="url(#ringRed)" stroke-width="5.5" stroke-linecap="round" />
  <!-- Outer Poké Ball Arc (Bottom White) -->
  <path d="M 6.5 32 A 25.5 25.5 0 0 0 57.5 32" fill="none" stroke="#F8FAFC" stroke-width="5.5" stroke-linecap="round" />

  <!-- Golden Lightning Bolt with Bold Middle Waist (中間那一橫加粗款) -->
  <polygon points="36,16 23,33.5 32.5,33.5 28,47 41,29 31.5,29" 
           fill="url(#boltGrad)" stroke="#FFE853" stroke-width="0.8" stroke-linejoin="round" />
</svg>
